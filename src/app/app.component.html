<div id="app-container">
    @if (auth.isLoggedIn()) {
    <div id="main-screen" class="screen active">
        <nav class="sidebar glass-panel">
            <div class="brand">
                <h2>Finanças</h2>
            </div>
            <ul class="nav-links">
                <li><a routerLink="/dashboard" routerLinkActive="active" class="nav-btn">Visão Geral</a></li>
                <li><a routerLink="/add-entry" routerLinkActive="active" class="nav-btn">Lançar Despesa</a></li>
                <li><a routerLink="/quick-leisure" routerLinkActive="active" class="nav-btn">Rápido (Lazer)</a></li>
                <li><a routerLink="/budget-planning" routerLinkActive="active" class="nav-btn">Planejamento</a></li>
                <li><a routerLink="/fixed-expenses" routerLinkActive="active" class="nav-btn">Contas Fixas</a></li>
                <li><a routerLink="/categories" routerLinkActive="active" class="nav-btn">Categorias</a></li>
            </ul>
            <div class="user-info">
                <span id="current-user">{{ auth.user()?.displayName }}</span>
                <button id="logout-btn" class="btn text-btn" (click)="auth.logout()">Sair</button>
            </div>
        </nav>

        <main class="content-area">
            <router-outlet></router-outlet>
        </main>
    </div>
    } @else {
    <div id="auth-screen" class="screen active">
        <div class="glass-card auth-card">
            <h1>House Finance</h1>
            <p>Gerencie as finanças da casa de forma rápida.</p>
            <button class="btn primary-btn btn-large google-btn" (click)="auth.loginWithGoogle()">
                <svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                        fill="#4285F4" />
                    <path
                        d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                        fill="#34A853" />
                    <path
                        d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
                        fill="#FBBC05" />
                    <path
                        d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                        fill="#EA4335" />
                </svg>
                Entrar com o Google
            </button>
        </div>
    </div>
    }
</div>
