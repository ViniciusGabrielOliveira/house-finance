<header class="page-header">
    <h1>Lançar Despesa</h1>
    <p class="subtitle">Registre um novo gasto manual</p>
</header>
<div class="glass-card" style="padding: 2rem;">
    <form (ngSubmit)="onSubmit()" #f="ngForm" class="stacked-form">
        <div class="input-row" style="margin-bottom: 1rem; display: flex; gap: 1rem;">
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                <input type="radio" name="entryType" value="expense" [(ngModel)]="type">
                <span>Despesa</span>
            </label>
            <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                <input type="radio" name="entryType" value="income" [(ngModel)]="type">
                <span>Receita</span>
            </label>
        </div>

        <div class="input-group">
            <label for="entry-desc">Descrição</label>
            <input type="text" id="entry-desc" name="desc" [(ngModel)]="desc">
        </div>
        <div class="input-row">
            <div class="input-group" style="flex: 1; min-width: 150px;">
                <label for="entry-amount">Valor (R$)</label>
                <input type="number" step="0.01" id="entry-amount" name="amount" [(ngModel)]="amount" required>
            </div>
            <div class="input-group" style="flex: 1; min-width: 150px;">
                <label for="entry-date">Data (Opcional)</label>
                <input type="date" id="entry-date" name="date" [(ngModel)]="date">
            </div>
        </div>
        <div class="input-group">
            <label for="entry-category">Categoria</label>
            <select id="entry-category" name="category" [(ngModel)]="category" required>
                @for (cat of finance.data().categories; track cat.id) {
                <option [value]="cat.id">{{ cat.name }}</option>
                }
            </select>
        </div>
        <button type="submit" class="btn primary-btn mt-2" [disabled]="!f.valid">Salvar Despesa</button>
    </form>
</div>
