<header class="page-header">
    <h1>Lançamento Rápido (Lazer)</h1>
    <p class="subtitle">Gastou na rua? Lança rapidão aqui.</p>
</header>
<div class="glass-card form-container">
    <form (ngSubmit)="onSubmit()" #f="ngForm">
        <div class="input-group">
            <label for="leisure-desc">Onde/O que foi?</label>
            <input type="text" id="leisure-desc" name="desc" [(ngModel)]="desc" autofocus>
        </div>
        <div class="input-row" style="display:flex; flex-wrap:wrap; gap:1rem;">
            <div class="input-group" style="flex: 1 1 150px;">
                <label for="leisure-amount">Valor (R$)</label>
                <input type="number" step="0.01" id="leisure-amount" name="amount" [(ngModel)]="amount" required>
            </div>
            <div class="input-group" style="flex: 1 1 150px;">
                <label for="leisure-date">Data</label>
                <input type="date" id="leisure-date" name="date" [(ngModel)]="date">
            </div>
        </div>
        <button type="submit" class="btn primary-btn btn-large mt-2" [disabled]="!f.valid">Gravar Lazer</button>
    </form>
</div>
