<header class="page-header">
    <h1>Categorias</h1>
    <p class="subtitle">Gerencie as categorias de despesas</p>
</header>

<div class="glass-card" style="padding: 2rem;">
    <form (ngSubmit)="onSubmit()" #f="ngForm" class="inline-form mb-4"
        style="display:flex; gap:1rem; align-items:center;">
        <div class="input-group flex-1" style="margin:0;">
            <input type="text" name="name" [(ngModel)]="catName" placeholder="Nova Categoria" required>
        </div>
        <div class="input-group w-auto" style="margin:0;">
            <input type="color" name="color" [(ngModel)]="catColor" required>
        </div>
        <button type="submit" class="btn primary-btn" [disabled]="!f.valid">
            {{ editingCategoryId ? 'Salvar' : 'Adicionar' }}
        </button>
        <button *ngIf="editingCategoryId" type="button" class="btn" (click)="cancelEdit()">Cancelar</button>
    </form>

    <ul class="pill-list" style="list-style:none; display:flex; flex-wrap:wrap; gap:0.5rem;">
        @for (cat of finance.data().categories; track cat.id) {
        <li class="pill" [style.backgroundColor]="cat.color" [style.color]="getTextColor(cat.color)">
            {{ cat.name }}
            <div style="display: flex; gap: 0.2rem; margin-left: 0.5rem;">
                <button class="action-btn" [style.color]="getTextColor(cat.color)" (click)="editCategory(cat)"
                    title="Editar">
                    <i class="fi fi-rr-edit" style="font-size: 0.8rem;"></i>
                </button>
                <button class="action-btn" [style.color]="getTextColor(cat.color)"
                    (click)="finance.removeCategory(cat.id)" title="Excluir">&times;</button>
            </div>
        </li>
        }
    </ul>
</div>
