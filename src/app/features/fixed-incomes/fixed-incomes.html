<header class="page-header">
    <h1>Receitas Fixas</h1>
    <p class="subtitle">Gerencie suas entradas recorrentes (ex: Salário, Aluguéis)</p>
</header>

<div class="glass-card" style="padding: 2rem;">
    <form (ngSubmit)="onSubmit()" #f="ngForm" class="inline-form mb-4"
        style="display:flex; gap:1rem; align-items:flex-end; flex-wrap:wrap;">
        <div class="input-group flex-1" style="margin:0; min-width:200px;">
            <label>Descrição</label>
            <input type="text" name="name" [(ngModel)]="incName" placeholder="Ex: Salário Mensal" required>
        </div>
        <div class="input-group" style="margin:0; width:150px;">
            <label>Valor Previsto</label>
            <input type="number" name="amount" [(ngModel)]="incAmount" placeholder="R$ 0,00" required min="0.01"
                step="0.01">
        </div>
        <div class="input-group" style="margin:0; width:150px;">
            <label>Data</label>
            <input type="date" name="receiptDate" [(ngModel)]="incDate" required>
        </div>

        <button type="submit" class="btn primary-btn" [disabled]="!f.valid">Adicionar</button>
    </form>

    <div class="list-container">
        @if (finance.data().fixedIncomes.length === 0) {
        <p class="empty-state">Nenhuma receita fixa cadastrada.</p>
        } @else {
        <div class="list-item" *ngFor="let inc of finance.data().fixedIncomes">
            <div class="item-info">
                <strong>{{ inc.name }}</strong>
                <span class="text-sm opacity-70">Previsto para: {{ inc.receiptDate | date:'dd/MM/yyyy' }}</span>
            </div>
            <div class="item-amount" style="color: var(--success); font-weight: 600;">
                + {{ inc.amount | currency:'BRL' }}
            </div>
            <div class="item-actions"
                style="display:flex; gap:0.5rem; align-items:center; flex-wrap:wrap; justify-content: flex-end; flex: 1;">
                <button class="btn primary-btn" style="padding: 0.2rem 0.5rem; font-size: 0.8rem;"
                    [disabled]="isReceived(inc)" (click)="receiveIncome(inc)">
                    {{ isReceived(inc) ? '✔ Recebido' : 'Receber Mês Atual' }}
                </button>
                <button class="action-btn"
                    style="color:var(--danger); font-size: 1.2rem; display:flex; align-items:center; padding: 0.2rem;"
                    (click)="finance.removeFixedIncome(inc.id)" title="Remover">&times;</button>
            </div>
        </div>
        }
    </div>
</div>
